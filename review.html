<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Confirmation – WDD 131 – João Ricardo Ribeiro da Silva</title>
    <meta name="description" content="Review confirmation page for WDD 131 Dynamic Web Fundamentals. Displays submission status and total reviews completed using localStorage.">
    <meta name="author" content="João Ricardo Ribeiro da Silva">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/review.js" defer></script>
</head>
<body>
    <header>
        <h1>Review Confirmation</h1>
    </header>

    <main>
        <section class="confirmation-card">
            <div class="success-icon">&#10004;</div>
            <h2>Thank You for Your Review!</h2>
            <p class="confirmation-message">Your feedback has been successfully recorded. We appreciate you taking the time to share your experience with us.</p>
            <div class="counter-box">
                <span class="counter-label">Total Reviews Completed</span>
                <span id="review-count" class="counter-value">0</span>
            </div>
            <a href="form.html" class="btn-home">Submit Another Review</a>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | João Ricardo Ribeiro da Silva | São Paulo, Brazil</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
