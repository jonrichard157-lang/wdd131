<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form – WDD 131 – João Ricardo Ribeiro da Silva</title>
    <meta name="description" content="Product Review Form for WDD 131 Dynamic Web Fundamentals. Submit feedback, ratings, and feature reviews for innovative tech products.">
    <meta name="author" content="João Ricardo Ribeiro da Silva">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <div class="form-item">
                <label for="product-name">Product Name <span class="required">*</span></label>
                <select id="product-name" name="product-name" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <div class="rating-section">
                <p class="group-heading">Overall Rating <span class="required">*</span></p>
                <div class="rating-container">
                    <div class="rating-item">
                        <label for="star1">&#9734;</label>
                        <input type="radio" id="star1" name="rating" value="1" required>
                    </div>
                    <div class="rating-item">
                        <label for="star2">&#9734;&#9734;</label>
                        <input type="radio" id="star2" name="rating" value="2" required>
                    </div>
                    <div class="rating-item">
                        <label for="star3">&#9734;&#9734;&#9734;</label>
                        <input type="radio" id="star3" name="rating" value="3" required>
                    </div>
                    <div class="rating-item">
                        <label for="star4">&#9734;&#9734;&#9734;&#9734;</label>
                        <input type="radio" id="star4" name="rating" value="4" required>
                    </div>
                    <div class="rating-item">
                        <label for="star5">&#9734;&#9734;&#9734;&#9734;&#9734;</label>
                        <input type="radio" id="star5" name="rating" value="5" required>
                    </div>
                </div>
            </div>

            <div class="form-item">
                <label for="install-date">Date of Installation <span class="required">*</span></label>
                <input type="date" id="install-date" name="install-date" required>
            </div>

            <div class="features-section">
                <p class="group-heading">Useful Features <span class="optional">(Check all that apply)</span></p>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-durability" name="features" value="durability">
                        <label for="feature-durability">Durability</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
                        <label for="feature-ease">Ease of Use</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-performance" name="features" value="performance">
                        <label for="feature-performance">Performance</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-design" name="features" value="design">
                        <label for="feature-design">Design</label>
                    </div>
                </div>
            </div>

            <div class="form-item">
                <label for="written-review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="written-review" name="written-review" rows="4"></textarea>
            </div>

            <div class="form-item">
                <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="user-name" name="user-name" autocomplete="name">
            </div>

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | João Ricardo Ribeiro da Silva | São Paulo, Brazil</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
