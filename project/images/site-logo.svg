<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="DevPulse AI Logo">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Icon Background Hexagon/Shield -->
  <rect x="10" y="10" width="60" height="60" rx="14" fill="url(#glowGrad)" stroke="url(#logoGrad)" stroke-width="2" />

  <!-- Code brackets and neural pulse inside icon -->
  <path d="M28 32 L20 40 L28 48" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M52 32 L60 40 L52 48" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="40" cy="40" r="5" fill="#2563eb" />
  <path d="M33 40 L37 40 M43 40 L47 40" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />

  <!-- Logo Text -->
  <text x="82" y="44" font-family="'Montserrat', sans-serif" font-weight="700" font-size="26" fill="#0f172a" letter-spacing="-0.5">DevPulse<tspan fill="#2563eb">AI</tspan></text>
  <text x="84" y="60" font-family="'Roboto', sans-serif" font-weight="500" font-size="10" fill="#64748b" letter-spacing="1.5">SMART CODE &amp; AUTOMATION</text>
</svg>
