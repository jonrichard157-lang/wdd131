<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Desktop Wireframe Layout for DevPulse AI Home Page">
  <defs>
    <style>
      .wf-bg { fill: #f8fafc; }
      .wf-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; }
      .wf-header { fill: #0f172a; }
      .wf-hero-bg { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; rx: 8px; }
      .wf-btn { fill: #2563eb; rx: 6px; }
      .wf-accent { fill: #06b6d4; rx: 4px; }
      .wf-title { font-family: 'Montserrat', sans-serif; font-weight: 700; fill: #0f172a; font-size: 15px; }
      .wf-h1 { font-family: 'Montserrat', sans-serif; font-weight: 700; fill: #0f172a; font-size: 22px; }
      .wf-label { font-family: 'Montserrat', sans-serif; font-weight: 600; fill: #ffffff; font-size: 13px; }
      .wf-nav { font-family: 'Montserrat', sans-serif; font-weight: 500; fill: #cbd5e1; font-size: 13px; }
      .wf-nav-active { font-family: 'Montserrat', sans-serif; font-weight: 700; fill: #38bdf8; font-size: 13px; }
      .wf-text { font-family: 'Roboto', sans-serif; font-size: 12px; fill: #64748b; line-height: 1.5; }
      .wf-code { font-family: monospace; font-size: 11px; fill: #38bdf8; }
      .wf-tag { font-family: 'Roboto', sans-serif; font-size: 10px; font-weight: 600; fill: #1e40af; }
    </style>
  </defs>

  <!-- Desktop Browser Frame -->
  <rect x="5" y="5" width="950" height="630" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <!-- Browser top toolbar -->
  <rect x="5" y="5" width="950" height="32" rx="12" fill="#e2e8f0" />
  <circle cx="25" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="59" cy="21" r="5" fill="#10b981" />
  <rect x="180" y="11" width="600" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="480" y="25" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="11" fill="#64748b">https://devpulse-ai.org/home</text>

  <!-- Page Background Canvas -->
  <rect x="5" y="37" width="950" height="598" class="wf-bg" />

  <!-- HEADER and NAVIGATION -->
  <rect x="5" y="37" width="950" height="56" class="wf-header" />
  <!-- Logo -->
  <text x="35" y="72" class="wf-label" font-size="18">DevPulse<tspan fill="#38bdf8">AI</tspan></text>
  <!-- Nav Links -->
  <text x="400" y="70" class="wf-nav-active">Home</text>
  <line x1="400" y1="77" x2="442" y2="77" stroke="#38bdf8" stroke-width="2" />
  <text x="475" y="70" class="wf-nav">Prompt Engineering</text>
  <text x="640" y="70" class="wf-nav">Intelligent Agents</text>
  <text x="795" y="70" class="wf-nav">References</text>
  <!-- Header CTA -->
  <rect x="850" y="49" width="85" height="32" class="wf-btn" rx="5" />
  <text x="892" y="70" text-anchor="middle" class="wf-label" font-size="11">Explore</text>

  <!-- DESKTOP HERO SECTION (2-Column Grid) -->
  <rect x="30" y="105" width="900" height="185" class="wf-hero-bg" />

  <!-- Hero Left Column -->
  <rect x="50" y="120" width="160" height="20" rx="10" fill="#dbeafe" />
  <text x="130" y="134" text-anchor="middle" class="wf-tag">ENGINEERING WITH AI &amp; AGENTS</text>
  <text x="50" y="168" class="wf-h1">AI-Driven Software Development &amp; Automation</text>
  <text x="50" y="194" class="wf-text">A practical developer guide exploring the transformation of coding, precision prompt</text>
  <text x="50" y="212" class="wf-text">engineering in JS/Python, and autonomous agents integrated with real-world messaging APIs.</text>
  <rect x="50" y="232" width="130" height="38" class="wf-btn" />
  <text x="115" y="256" text-anchor="middle" class="wf-label">Read Full Guide &#8594;</text>
  <rect x="195" y="232" width="120" height="38" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text x="255" y="256" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="600" fill="#2563eb" font-size="12">Explore Agents</text>

  <!-- Hero Right Column: Interactive Code Box -->
  <rect x="530" y="120" width="380" height="152" rx="8" fill="#0f172a" />
  <circle cx="550" cy="136" r="4" fill="#ef4444" />
  <circle cx="562" cy="136" r="4" fill="#f59e0b" />
  <circle cx="574" cy="136" r="4" fill="#10b981" />
  <text x="720" y="140" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="10" fill="#94a3b8">agent-workflow.js</text>
  <line x1="530" y1="148" x2="910" y2="148" stroke="#334155" stroke-width="1" />
  <text x="548" y="170" class="wf-code"><tspan fill="#ec4899">const</tspan> agent = <tspan fill="#f59e0b">new</tspan> DeveloperAgent({</text>
  <text x="565" y="190" class="wf-code">model: <tspan fill="#a7f3d0">'advanced-reasoning'</tspan>,</text>
  <text x="565" y="210" class="wf-code">tools: [<tspan fill="#a7f3d0">'linter'</tspan>, <tspan fill="#a7f3d0">'test-runner'</tspan>, <tspan fill="#a7f3d0">'api-sync'</tspan>]</text>
  <text x="548" y="230" class="wf-code">});</text>
  <text x="548" y="252" class="wf-code"><tspan fill="#64748b">// Output: Automated refactor ready in 1.4s &#10004;</tspan></text>

  <!-- 3-COLUMN CORE TOPICS GRID -->
  <!-- Column 1: Overview -->
  <rect x="30" y="306" width="285" height="175" class="wf-card" />
  <rect x="45" y="322" width="36" height="36" rx="8" fill="#e0f2fe" />
  <text x="63" y="345" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" fill="#0284c7" font-size="16">&lt;/&gt;</text>
  <text x="92" y="342" class="wf-title">1. Full-Stack AI Overview</text>
  <text x="45" y="378" class="wf-text">How AI tools enhance the complete</text>
  <text x="45" y="396" class="wf-text">software lifecycle: architecture, coding,</text>
  <text x="45" y="414" class="wf-text">and automated peer code review.</text>
  <rect x="45" y="435" width="95" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="92" y="452" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10" fill="#2563eb">Explore Topic &#8594;</text>

  <!-- Column 2: Prompt Engineering -->
  <rect x="338" y="306" width="285" height="175" class="wf-card" />
  <rect x="353" y="322" width="36" height="36" rx="8" fill="#fef3c7" />
  <text x="371" y="345" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" fill="#d97706" font-size="16">&#9881;</text>
  <text x="400" y="342" class="wf-title">2. Prompt Engineering</text>
  <text x="353" y="378" class="wf-text">Structured command templates for</text>
  <text x="353" y="396" class="wf-text">generating, refactoring, and fixing code</text>
  <text x="353" y="414" class="wf-text">across JavaScript, Python, and SQL.</text>
  <rect x="353" y="435" width="95" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="400" y="452" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10" fill="#2563eb">Explore Topic &#8594;</text>

  <!-- Column 3: Intelligent Agents -->
  <rect x="645" y="306" width="285" height="175" class="wf-card" />
  <rect x="660" y="322" width="36" height="36" rx="8" fill="#ecfdf5" />
  <text x="678" y="345" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" fill="#059669" font-size="16">&#9729;</text>
  <text x="707" y="342" class="wf-title">3. Autonomous Agents</text>
  <text x="660" y="378" class="wf-text">Architecture &amp; practical setups for</text>
  <text x="660" y="396" class="wf-text">connecting autonomous agents with</text>
  <text x="660" y="414" class="wf-text">messaging APIs and customer workflows.</text>
  <rect x="660" y="435" width="95" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="707" y="452" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10" fill="#2563eb">Explore Topic &#8594;</text>

  <!-- WORKFLOW STRIP -->
  <rect x="30" y="495" width="900" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="50" y="522" class="wf-title" font-size="13">Workflow Pipeline:</text>
  <rect x="180" y="505" width="135" height="25" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text x="247" y="521" text-anchor="middle" class="wf-text" fill="#2563eb" font-weight="600">1. Structured Prompt</text>
  <text x="330" y="522" font-family="'Roboto', sans-serif" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="350" y="505" width="145" height="25" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text x="422" y="521" text-anchor="middle" class="wf-text" fill="#2563eb" font-weight="600">2. Autonomous Agent</text>
  <text x="510" y="522" font-family="'Roboto', sans-serif" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="530" y="505" width="145" height="25" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text x="602" y="521" text-anchor="middle" class="wf-text" fill="#2563eb" font-weight="600">3. Messaging API Sync</text>
  <text x="690" y="522" font-family="'Roboto', sans-serif" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="710" y="505" width="130" height="25" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
  <text x="775" y="521" text-anchor="middle" class="wf-text" fill="#15803d" font-weight="600">4. Automated Result</text>

  <!-- FOOTER -->
  <rect x="5" y="555" width="950" height="80" class="wf-header" />
  <text x="35" y="585" class="wf-label" font-size="14">DevPulse<tspan fill="#38bdf8">AI</tspan></text>
  <text x="35" y="605" class="wf-text" fill="#94a3b8">Practical Guide to AI-Driven Software Engineering</text>
  <text x="480" y="585" text-anchor="middle" class="wf-text" fill="#94a3b8">&#169; 2026 DevPulse AI | João Ricardo Ribeiro da Silva | WDD 131</text>
  <text x="480" y="605" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="11" fill="#38bdf8">Home  &#8226;  Prompt Engineering  &#8226;  Intelligent Agents  &#8226;  References</text>
  <text x="910" y="595" text-anchor="end" class="wf-text" fill="#64748b">São Paulo, Brazil</text>
</svg>
